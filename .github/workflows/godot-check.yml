name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  headless-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot and matching export templates
        shell: bash
        run: |
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          engine="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/godot.zip" "$release/$engine.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/$engine"
          echo "GODOT_BIN=$RUNNER_TEMP/$engine" >> "$GITHUB_ENV"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/templates.tpz" "$release/Godot_v${GODOT_VERSION}_export_templates.tpz"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$templates"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/windows_release_x86_64.exe' -d "$templates"
      - name: Import, start, and export
        shell: bash
        run: |
          checked_godot() {
            local log
            log="$(mktemp)"
            if ! "$GODOT_BIN" "$@" > "$log" 2>&1; then
              cat "$log"
              return 1
            fi
            cat "$log"
            if grep -qE 'ERROR:' "$log"; then
              return 1
            fi
          }
          checked_godot --headless --path godot --editor --import --quit
          checked_godot --headless --path godot --quit-after 12
          mkdir -p dist
          checked_godot --headless --path godot --export-release "Windows Desktop" "$PWD/dist/TumanPrototype.exe"
          test -s dist/TumanPrototype.exe
          test -s dist/TumanPrototype.pck
      - name: Upload portable Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: TumanPrototype-Windows-x64
          path: |
            dist/TumanPrototype.exe
            dist/TumanPrototype.pck
          if-no-files-found: error
      - name: Package portable Windows ZIP
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          cd dist
          zip -q TumanPrototype-Windows-x64.zip TumanPrototype.exe TumanPrototype.pck
          unzip -t TumanPrototype-Windows-x64.zip
      - name: Publish public GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="prototype-${GITHUB_SHA:0:12}"
          gh release create "$tag" "dist/TumanPrototype-Windows-x64.zip" \
            --title "Туман Windows prototype ${GITHUB_SHA:0:12}" \
            --notes "Автоматическая тестовая Windows x64 сборка. Распакуй ZIP и запусти TumanPrototype.exe. Прозрачность и click-through требуют проверки на Windows." \
            --target "$GITHUB_SHA" \
            --latest
